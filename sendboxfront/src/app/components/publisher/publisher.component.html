<div class="container">
    <div class="row m-1 align-items-end">
        <div class="col-auto">
            <label for="inputCity" class="form-label">City:</label>
        </div>
        <div class="col-auto">
            <select class="form-select" (change)="changeCity($event)">
            @for(city of cities; track $index){
                <option value="{{city}}">{{city}}</option>
            }
            </select>
        </div>
    </div>
    <div class="row m-1 align-items-end">
        <div class="col-auto">
            <label for="inputDate" class="form-label">Date:</label>
        </div>
        <div class="col-auto">
            <input type="date" class="form-control form-control-sm" id="inputDate" [(ngModel)]="message.date" placeholder="Date" />
        </div>
    </div>
    <div class="row m-1 align-items-end">
        <div class="col-auto">
            <label for="inputAuthor" class="form-label">Author:</label>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control form-control-sm" id="inputAuthor" [(ngModel)]="message.author" placeholder="Author" />
        </div>
    </div>
    <div class="row m-1 align-items-end">
        <div class="col-auto">
            <label for="inputMessage" class="form-label">Message:</label>
        </div>
        <div class="col-auto">
            <textarea class="form-control form-control-sm" id="inputMessage" [(ngModel)]="message.message"></textarea>
        </div>
    </div>
    <button type="button" class="btn btn-primary btn-sm" (click)="sendLetter()">Send</button>

    <div class="p-5">
        @if(resp$){
            <p class="text-success">Send success</p>
        }@else {

        }
    </div>
</div>
